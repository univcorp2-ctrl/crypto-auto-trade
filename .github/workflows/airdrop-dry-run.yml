name: Airdrop Agent Hourly Acquisition Cycle

on:
  workflow_dispatch:
  schedule:
    # Use two off-hour trigger opportunities; the freshness gate below keeps the
    # acquisition work to roughly once per hour while tolerating a dropped cron event.
    - cron: "23,53 * * * *"
  push:
    branches:
      - main
      - feat/airdrop-*
    paths:
      - "crypto_auto_trade/airdrop_agents.py"
      - "crypto_auto_trade/airdrop_acquisition.py"
      - "crypto_auto_trade/airdrop_terms_safe_acquisition.py"
      - "crypto_auto_trade/airdrop_kyan_current.py"
      - "crypto_auto_trade/airdrop_live_overrides.py"
      - "crypto_auto_trade/airdrop_current_promotion.py"
      - "crypto_auto_trade/airdrop_additional_current_paths.py"
      - "crypto_auto_trade/airdrop_grvt_tge_claim.py"
      - "crypto_auto_trade/airdrop_standx_maker_points.py"
      - "crypto_auto_trade/airdrop_decibel_claim_surface.py"
      - "crypto_auto_trade/airdrop_decibel_live_campaigns.py"
      - "crypto_auto_trade/airdrop_decibel_referral.py"
      - "tests/test_airdrop*.py"
      - "static/airdrop.*"
      - "static/index.html"
      - "crypto_auto_trade/web.py"
      - "AIRDROP_OPERATIONS.md"
      - ".github/workflows/airdrop-dry-run.yml"

permissions:
  contents: write

# Keep feature-branch validation independent from main, and never cancel a valid
# in-progress acquisition cycle just because a newer schedule/push arrives.
# GitHub will still coalesce pending runs in each ref-specific group by default.
concurrency:
  group: airdrop-agent-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquisition-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Decide whether a scheduled cycle is due
        id: cadence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          run_cycle = True
          reason = f"{event or 'unknown'} event runs the cycle"

          if event == "schedule":
              status_path = Path("data/airdrop/latest.json")
              if status_path.exists():
                  try:
                      generated_at = json.loads(status_path.read_text()).get("generated_at")
                      generated = datetime.fromisoformat(str(generated_at).replace("Z", "+00:00"))
                      age_seconds = (datetime.now(UTC) - generated.astimezone(UTC)).total_seconds()
                      if 0 <= age_seconds < 35 * 60:
                          run_cycle = False
                          reason = f"latest status is only {age_seconds / 60:.1f} minutes old"
                      else:
                          reason = f"latest status is {age_seconds / 60:.1f} minutes old"
                  except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
                      reason = f"freshness check failed safely: {exc}"
              else:
                  reason = "latest status is missing"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_cycle={'true' if run_cycle else 'false'}\n")
              output.write(f"reason={reason}\n")
          print({"run_cycle": run_cycle, "reason": reason})
          PY

      - uses: actions/setup-python@v6
        if: steps.cadence.outputs.run_cycle == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        if: steps.cadence.outputs.run_cycle == 'true'
        run: pip install -e '.[dev,web]'

      - name: Safety, acquisition and web tests
        if: steps.cadence.outputs.run_cycle == 'true'
        run: pytest -q tests/test_airdrop*.py

      - name: Run terms-safe gated acquisition cycle
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_terms_safe_acquisition \
            --status-output data/airdrop/latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Refresh current Kyan Krystals lifecycle
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_kyan_current \
            --status-input data/airdrop/latest.json \
            --status-output data/airdrop/latest.json \
            --acquisition-input data/airdrop/acquisition-latest.json \
            --acquisition-output data/airdrop/acquisition-latest.json

      - name: Apply current approval metadata
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_live_overrides \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Promote fresh current evidence after base TTL
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_current_promotion \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Apply current additional reward paths
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_additional_current_paths \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Apply current GRVT TGE released-tranche claim path
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_grvt_tge_claim \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Apply current StandX Maker Points path
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_standx_maker_points \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      # Decibel's current Terms prohibit access to the Services by automated means.
      # Do not live-fetch Decibel docs/app surfaces in the scheduled agent. The
      # terms-safe acquisition wrapper blocks Decibel targets and retains only
      # static approval metadata for manual review.
      - name: Apply cached Decibel live-campaign approval metadata
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_decibel_live_campaigns \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Apply cached Decibel referral approval metadata
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python -m crypto_auto_trade.airdrop_decibel_referral \
            --input data/airdrop/acquisition-latest.json \
            --output data/airdrop/acquisition-latest.json

      - name: Show acquisition summary and enforce safety boundary
        if: steps.cadence.outputs.run_cycle == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('data/airdrop/latest.json').read_text())
          acquisition = json.loads(Path('data/airdrop/acquisition-latest.json').read_text())

          print({k: status[k] for k in ['generated_at','target_count','ready_dry_run','read_only','unverified','live_approved','terms_automation_blocked_count']})
          print({k: acquisition[k] for k in ['generated_at','mode','target_count','reward_path_count','auto_executed_action_count','approval_required_count','additional_approval_required_count','blocked_unverified_count','reverify_required_count','live_override_count','current_evidence_promotion_count','terms_automation_blocked_count']})

          assert status['target_count'] == 20
          assert acquisition['target_count'] == 20
          assert status['live_approved'] is False
          assert acquisition['live_approved'] is False
          assert status['terms_automation_blocked_count'] == 2
          assert acquisition['terms_automation_blocked_count'] == 2
          assert acquisition['blocked_unverified_count'] >= 2
          assert acquisition['financial_actions_executed'] == 0
          assert acquisition['asset_transfers_executed'] == 0
          assert acquisition['wallet_signatures_executed'] == 0
          assert acquisition['live_orders_executed'] == 0
          assert acquisition['live_override_count'] >= 0
          assert acquisition['current_evidence_promotion_count'] >= 0
          PY

      - name: Commit refreshed status and acquisition queue on scheduled/main runs
        if: github.ref == 'refs/heads/main' && steps.cadence.outputs.run_cycle == 'true'
        run: |
          if git diff --quiet -- data/airdrop/latest.json data/airdrop/acquisition-latest.json && \
             git ls-files --error-unmatch data/airdrop/latest.json >/dev/null 2>&1 && \
             git ls-files --error-unmatch data/airdrop/acquisition-latest.json >/dev/null 2>&1; then
            echo "No status or acquisition change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airdrop/latest.json data/airdrop/acquisition-latest.json
          git commit -m "chore: refresh hourly airdrop acquisition cycle" || exit 0
          git push
