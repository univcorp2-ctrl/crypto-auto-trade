name: Airdrop Agent Hourly Dry Run

on:
  workflow_dispatch:
  schedule:
    # Keep hourly cadence but avoid the busiest start-of-hour window.
    - cron: "23 * * * *"
  push:
    branches:
      - main
      - feat/airdrop-agent-web
    paths:
      - "crypto_auto_trade/airdrop_agents.py"
      - "tests/test_airdrop*.py"
      - "static/airdrop.*"
      - "static/index.html"
      - "crypto_auto_trade/web.py"
      - ".github/workflows/airdrop-dry-run.yml"

permissions:
  contents: write

concurrency:
  group: airdrop-agent-hourly
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -e '.[dev,web]'

      - name: Safety and web tests
        run: pytest -q tests/test_airdrop_agents.py tests/test_airdrop_web.py

      - name: Generate latest DRY RUN status
        run: python -m crypto_auto_trade.airdrop_agents --output data/airdrop/latest.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('data/airdrop/latest.json').read_text())
          print({k: d[k] for k in ['generated_at','target_count','ready_dry_run','read_only','unverified','live_approved']})
          assert d['target_count'] == 20
          assert d['live_approved'] is False
          PY

      - name: Commit refreshed status on scheduled/main runs
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/airdrop/latest.json && git ls-files --error-unmatch data/airdrop/latest.json >/dev/null 2>&1; then
            echo "No status change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airdrop/latest.json
          git commit -m "chore: refresh hourly airdrop dry-run status" || exit 0
          git push
