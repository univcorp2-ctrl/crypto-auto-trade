name: Airdrop Tests Diagnostic

on:
  push:
    branches:
      - feat/airdrop-diagnose-full-cycle-20260819
    paths:
      - ".github/workflows/airdrop-tests-diagnostic.yml"

permissions:
  contents: write

jobs:
  tests-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -e '.[dev,web]'

      - name: Run current Airdrop tests
        run: pytest -q tests/test_airdrop*.py

      - name: Record passing test diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          path = Path('data/airdrop/tests-diagnostic.json')
          path.write_text(json.dumps({
              'generated_at': datetime.now(UTC).isoformat(),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'tests': 'PASS',
              'financial_actions_executed': 0,
              'asset_transfers_executed': 0,
              'wallet_signatures_executed': 0,
              'live_orders_executed': 0,
          }, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airdrop/tests-diagnostic.json
          git commit -m "chore: record passing Airdrop test diagnostic"
          git push
